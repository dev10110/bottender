{% extends "base.html" %}
{% block content %}
    <div class="container">
        <section>
            <h3>Preparing: {{ drink.name }}</h3>
            <section>
                <h4>{{ stage_index + 1 }}. {{ stage.instruction }}</h4>
                <img id="emptyglass"
                     src="{{ url_for('static', filename='figs/fill_gif/fill_00.png') }}" />
                <img id="fillgif"
                     hidden
                     src="{{ url_for('static', filename='gifs/fill_gif.gif') }}" />
                <img id="filledglass"
                     hidden
                     src="{{ url_for('static', filename='figs/fill_gif/fill_47.png') }}" />
            </section>
            <a id="release"
               href="#"
               onclick="release()"
               class="btn btn-block btn-lg btn-primary"
               role="button">{{
            stage.button_text }}</a>
        </section>
    </div>
    <script>
    function set_drink_image_to_pouring() 
    {
        document.getElementById("emptyglass").hidden = true;
        document.getElementById("fillgif").hidden = false;
        document.getElementById("filledglass").hidden = true;
        var release_button = document.getElementById("release");
        release_button.innerText = "Pouring...";
        release_button.className += " outline";
        release_button.setAttribute('aria-busy', "true");
        release_button.setAttribute('onclick', "console.log('BUTTON DISABLED')");

    }

    function set_drink_image_to_done() {

        var release_button = document.getElementById("release");
            release_button.innerText = "Done. Loading next step...";
            release_button.setAttribute('aria-busy', "false")
            document.getElementById("emptyglass").hidden = true;
            document.getElementById("fillgif").hidden = true;
            document.getElementById("filledglass").hidden = false;
    }

    function sleep_for_ms(ms) {
            setTimeout(() => {
                console.log("This runs after 2 seconds");
            }, ms); 
        }
    function release() {
        console.log("Releasing stage {{ stage_index }} for drink {{ uuid }}");

        set_drink_image_to_pouring();

        fetch(`${window.origin}/pour_stage/{{ uuid }}/{{ stage_index }}`, {
            method: "POST",
            credentials: "include",
            body: JSON.stringify("release"),
            cache: "no-cache",
            headers: new Headers({
                "content-type": "application/json"
            })
        }).then(function (response) {
            if (response.status !== 200) {
                console.log("STATUS IS NOT 200")
                return;
            }

            console.log("Received response for stage release:", response);

            set_drink_image_to_done();

            if (response.redirected) {
                setTimeout(() => {
                    console.log("Redirecting to:", response.url);
                    window.location.href = response.url;
                }, 500); // 0.5 second delay before redirect
                return;
            }
        });
    }   
    </script>
{% endblock %}
